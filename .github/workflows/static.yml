# Deploys the game to GitHub Pages:
# https://kal-hermes.github.io/TASDIS/
#
# The site lives under a project subpath, so every asset reference in the
# game must stay relative (js/app.js, not /js/app.js). Only the runtime files
# are staged: tests, tools, and coverage reports are not published. A new
# runtime folder needs a line in the staging step and in the trigger paths.
name: Deploy the game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - game/index.html
      - game/css/**
      - game/js/**
      - .github/workflows/static.yml
  workflow_dispatch:

# The checkout reads the repository. Pages needs the other two. The wait
# step reads the artifacts of this run.
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# A new push replaces a deploy that still runs. Two deploys never overlap.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the game (runtime files only)
        run: |
          mkdir _site
          cp --recursive game/index.html game/css game/js _site/
          test -f _site/index.html
          test -f _site/css/main.css
          test -f _site/js/app.js
          test -f _site/js/prompts/mock-script.json
          test -f _site/js/problems/url-shortener.json
          test -f _site/js/vendor/katex.min.js
          test -f _site/js/vendor/katex.min.css
          test -f _site/js/vendor/mermaid.min.js
          test -f _site/js/vendor/fonts/KaTeX_Main-Regular.woff2

      # Pages must be on for the repository before this step can run: in the
      # repository settings, under Pages, the source is "GitHub Actions".
      # The token of a workflow run cannot turn Pages on. Turn it on once.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHub lists a new artifact a moment after the upload reports
      # success. One run deployed before that moment and found no artifact.
      # This step waits until the artifact is listed.
      - name: Wait for the uploaded artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 10); do
            listed=$(gh api \
              "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$listed" = "1" ]; then
              echo "The artifact github-pages is listed (attempt $attempt)."
              exit 0
            fi
            sleep 6
          done
          echo "The artifact github-pages is not listed after 10 attempts."
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v4
